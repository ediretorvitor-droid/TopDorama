name: Build Top Dorama APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test data, dates and statistics rules
        run: node --test tests/*.test.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp app/topdorama-debug.keystore "$HOME/.android/debug.keystore"
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TopDorama-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
# The committed key signs test builds only. Production must use Play App Signing.
