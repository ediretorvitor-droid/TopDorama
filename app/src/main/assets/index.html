<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Dorama</title><style>body{font-family:Arial;margin:0;background:#fff7fb;color:#2c1d29}header{background:#8e3b70;color:#fff;padding:24px;text-align:center}.wrap{padding:16px;max-width:720px;margin:auto}.card{background:#fff;border:1px solid #ead9e4;border-radius:18px;padding:14px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 90px 120px auto;gap:8px;align-items:center}.field,button,select,textarea{font:inherit}.field,select,textarea{width:100%;padding:10px;border:1px solid #d9c5d2;border-radius:10px;box-sizing:border-box}button{border:0;border-radius:10px;padding:10px 12px;background:#8e3b70;color:#fff;font-weight:700}.muted{color:#7e6a77;font-size:13px}.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.score{font-weight:700;color:#8e3b70}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#ead9e4;color:#6e3657}.tabs button.active{background:#8e3b70;color:#fff}.hidden{display:none}</style></head><body><header><h1>💜 Top Dorama</h1><div>Seu diário e ranking de doramas</div></header><div class="wrap"><div class="card"><div class="tabs"><button onclick="show('home')">Início</button><button onclick="show('add')">Adicionar</button><button onclick="show('ranking')">Ranking</button><button onclick="show('queue')">Fila</button></div></div><section id="home"><div class="card"><h2>Resumo</h2><div id="summary" class="muted"></div></div><div class="card"><h2>Top 3</h2><div id="top3"></div></div></section><section id="add" class="hidden"><div class="card"><h2>Adicionar dorama</h2><input id="name" class="field" placeholder="Nome do dorama"><br><br><select id="status"><option value="done">Concluído</option><option value="watching">Assistindo</option><option value="queue">Quero assistir</option><option value="paused">Pausado</option><option value="dropped">Abandonei</option></select><br><br><input id="rating" class="field" type="number" min="1" max="10" step="0.1" placeholder="Nota de 1 a 10"><br><br><input id="finishDate" class="field" type="date"><br><br><textarea id="notes" class="field" placeholder="Observações"></textarea><br><br><button onclick="save()">Salvar</button></div></section><section id="ranking" class="hidden"><div class="card"><h2>Ranking automático</h2><div id="rankingList"></div><br><button onclick="shareRanking()">Compartilhar ranking</button></div></section><section id="queue" class="hidden"><div class="card"><h2>Quero assistir</h2><div id="queueList"></div></div></section></div><script>const KEY='topdorama_mvp';let items=[];const $=id=>document.getElementById(id);function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}render()}function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}function show(id){['home','add','ranking','queue'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function save(){let name=$('name').value.trim();if(!name)return alert('Informe o nome.');let status=$('status').value;let rating=$('rating').value?Number($('rating').value):null;if(status==='done'&&rating&&(rating<1||rating>10))return alert('A nota deve ser entre 1 e 10.');items.push({id:Date.now(),name,status,rating,finishDate:$('finishDate').value,notes:$('notes').value});persist();$('name').value='';$('rating').value='';$('finishDate').value='';$('notes').value='';show(status==='queue'?'queue':'ranking')}function sorted(){return items.filter(x=>x.status==='done'&&x.rating).sort((a,b)=>b.rating-a.rating)}function render(){let done=items.filter(x=>x.status==='done');let queue=items.filter(x=>x.status==='queue');let avg=done.filter(x=>x.rating).length?done.filter(x=>x.rating).reduce((a,b)=>a+b.rating,0)/done.filter(x=>x.rating).length:0;$('summary').innerHTML=`Assistidos: <b>${done.length}</b> • Na fila: <b>${queue.length}</b> • Média: <b>${avg?avg.toFixed(1):'—'}</b>`;let top=sorted().slice(0,3);$('top3').innerHTML=top.length?top.map((x,i)=>`<div class="item"><b>${['🥇','🥈','🥉'][i]}</b><div>${x.name}<div class="muted">${x.notes||''}</div></div><div class="score">${x.rating.toFixed(1)}</div></div>`).join(''):'<div class="muted">Nenhuma avaliação ainda.</div>';$('rankingList').innerHTML=sorted().length?sorted().map((x,i)=>`<div class="item"><b>${i+1}º</b><div>${x.name}<div class="muted">${x.finishDate||''} ${x.notes?'• '+x.notes:''}</div></div><div class="score">${x.rating.toFixed(1)}</div></div>`).join(''):'<div class="muted">Seu ranking aparecerá aqui.</div>';$('queueList').innerHTML=queue.length?queue.map(x=>`<div class="item"><b>🎬</b><div>${x.name}<div class="muted">${x.notes||''}</div></div><button onclick="markDone(${x.id})">Concluir</button></div>`).join(''):'<div class="muted">Sua fila está vazia.</div>'}function markDone(id){let x=items.find(i=>i.id===id);if(!x)return;let n=prompt('Qual nota de 1 a 10?');if(!n)return;x.status='done';x.rating=Number(n);x.finishDate=new Date().toISOString().slice(0,10);persist()}function shareRanking(){let a=sorted().slice(0,10);if(!a.length)return alert('Cadastre avaliações primeiro.');let text='💜 MEU TOP DORAMAS\n\n'+a.map((x,i)=>`${i+1}º ${x.name} — ${x.rating.toFixed(1)}`).join('\n')+'\n\nFeito no Top Dorama';if(window.TopDoramaAndroid&&TopDoramaAndroid.share)TopDoramaAndroid.share(text);else alert(text)}load();</script></body></html>
